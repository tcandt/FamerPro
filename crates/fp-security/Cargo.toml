[package]
name = "fp-security"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fp-domain = { path = "../fp-domain" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
regex = "1.11"
base64 = "0.21"
sha2 = "0.10.9"
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc", "zeroize"] }
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "std", "zeroize"] }
zeroize = { version = "1.8.2", features = ["std"] }
rand.workspace = true
chrono.workspace = true
uuid.workspace = true
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std"] }

<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FarmerPro Mini Auto-Tool Runtime</title>
  <style>
    :root {
      --accent: #38bdf8;
      --header-bg: #141c28;
      --bg-main: #0f1622;
      --bg-card: #16202f;
      --bg-elevated: #1c293d;
      --border: #2a3647;
      --text-main: #edf3fc;
      --text-muted: #94a3b8;
      --success: #3bc38d;
      --warning: #f59e0b;
      --danger: #f27883;
      --row-pad-y: 7px;
      --row-pad-x: 9px;
      --pane-pad: 8px;
      --card-gap: 6px;
    }

    body.density-compact {
      --row-pad-y: 4px;
      --row-pad-x: 7px;
      --pane-pad: 6px;
      --card-gap: 4px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    body {
      background: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-size: 12px;
      user-select: none;
    }

    .topbar {
      background: var(--header-bg);
      border-bottom: 1px solid var(--border);
      padding: 6px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      gap: 8px;
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex-wrap: wrap;
    }

    .brand-icon {
      width: 20px;
      height: 20px;
      border-radius: 5px;
      border: 1px solid var(--accent);
      background: #1e293b;
      object-fit: cover;
      shrink: 0;
    }

    .badge {
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      background: rgba(56, 189, 248, 0.14);
      color: var(--accent);
      border: 1px solid var(--accent);
      white-space: nowrap;
    }

    .sig-pill {
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      background: rgba(59, 195, 141, 0.14);
      color: var(--success);
      border: 1px solid rgba(59, 195, 141, 0.4);
      white-space: nowrap;
    }

    .mode-pill-live {
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      background: #133528;
      color: #3bc38d;
      border: 1px solid #3bc38d;
      white-space: nowrap;
    }

    .mode-pill-offline {
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      background: #381e24;
      color: #f27883;
      border: 1px solid #f27883;
      white-space: nowrap;
    }

    .prov-pill {
      display: inline-block;
      margin-left: 5px;
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.02em;
      vertical-align: middle;
      white-space: nowrap;
    }
    .prov-live-ok {
      background: rgba(59, 195, 141, 0.16);
      color: #3bc38d;
      border: 1px solid rgba(59, 195, 141, 0.5);
    }
    .prov-live-unverified {
      background: rgba(56, 189, 248, 0.14);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.5);
    }
    .prov-testkit {
      background: rgba(245, 158, 11, 0.16);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.55);
    }
    .prov-legacy {
      background: rgba(148, 163, 184, 0.14);
      color: #94a3b8;
      border: 1px solid rgba(148, 163, 184, 0.4);
    }
    .btn-testkit {
      background: rgba(245, 158, 11, 0.16);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.55);
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 11px;
    }
    .btn-testkit:hover {
      background: rgba(245, 158, 11, 0.28);
    }

    .sec-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 10px;
      background: #131b27;
      border-bottom: 1px solid var(--border);
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      cursor: pointer;
    }

    .sec-hdr:hover {
      color: var(--text-main);
    }

    .device-section {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .device-table-wrap {
      max-height: 120px;
      overflow-y: auto;
    }

    body.density-compact .device-table-wrap {
      max-height: 92px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11.5px;
    }

    th {
      background: #121a26;
      color: var(--text-muted);
      font-weight: 700;
      text-align: left;
      padding: 5px 9px;
      border-bottom: 1px solid var(--border);
      font-size: 10px;
      text-transform: uppercase;
    }

    td {
      padding: var(--row-pad-y) var(--row-pad-x);
      border-bottom: 1px solid rgba(42, 54, 71, 0.5);
    }

    tr.active-row {
      background: rgba(56, 189, 248, 0.08);
    }

    .state-online {
      color: var(--success);
      font-weight: 700;
    }

    .state-offline {
      color: var(--danger);
      font-weight: 700;
    }

    .main-scroll {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    .workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 1.3fr 0.7fr;
      overflow: hidden;
      min-height: 0;
    }

    .workspace.preset-expanded {
      grid-template-columns: 1.45fr 0.85fr;
    }

    .workspace.single-col {
      display: flex;
      flex-direction: column;
    }

    .workspace.no-right {
      grid-template-columns: 1fr;
    }

    .left-pane {
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    .workspace.single-col .left-pane {
      border-right: none;
      border-bottom: 1px solid var(--border);
      flex: 1 1 auto;
      min-height: 110px;
    }

    .workspace.single-col .right-pane {
      flex: 0 1 125px;
      min-height: 82px;
    }

    .right-pane {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #0c121c;
      min-height: 0;
    }

    .tab-bar {
      display: flex;
      background: #131b27;
      border-bottom: 1px solid var(--border);
      padding: 0 8px;
      gap: 4px;
      flex-shrink: 0;
      align-items: center;
      justify-content: space-between;
    }

    .tab-bar-tabs {
      display: flex;
      gap: 4px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 11px;
      padding: 7px 10px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      text-transform: uppercase;
    }

    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .pane-body {
      flex: 1;
      overflow-y: auto;
      padding: var(--pane-pad);
    }

    .task-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: var(--row-pad-y) var(--row-pad-x);
      margin-bottom: var(--card-gap);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      gap: 8px;
    }

    .task-row:hover {
      border-color: var(--accent);
    }

    .task-left {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      min-width: 0;
      flex: 1;
    }

    .task-left input[type="checkbox"] {
      margin-top: 2px;
      flex-shrink: 0;
    }

    .cat-tag {
      font-size: 10px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 3px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .task-title {
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.32;
      white-space: normal;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .task-right {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .status-pill {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      background: #202b3b;
      color: #94a3b8;
      white-space: nowrap;
    }

    .status-pill.running {
      background: #173355;
      color: #38bdf8;
    }

    .status-pill.done {
      background: #133528;
      color: #3bc38d;
    }

    .status-pill.err {
      background: #381e24;
      color: #f27883;
    }

    .icon-btn {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 4px;
      padding: 3px 6px;
      font-size: 11px;
      cursor: pointer;
    }

    .icon-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .console-box {
      flex: 1;
      background: #090e16;
      color: #d1fae5;
      font-family: Consolas, monospace;
      font-size: 11px;
      padding: 8px;
      overflow-y: auto;
      line-height: 1.45;
    }

    .log-line {
      margin-bottom: 3px;
      word-break: break-word;
    }

    .log-ts {
      color: #64748b;
      margin-right: 5px;
    }

    .setting-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 6px;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 6px;
      gap: 8px;
    }

    input[type="number"],
    select {
      background: #0f1622;
      border: 1px solid var(--border);
      color: #fff;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 11px;
    }

    .footer {
      background: var(--header-bg);
      border-top: 1px solid var(--border);
      padding: 6px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-primary {
      background: var(--accent);
      color: #090d16;
      border: none;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 11.5px;
    }

    .btn-secondary {
      background: var(--bg-elevated);
      color: var(--text-main);
      border: 1px solid var(--border);
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 11px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <div id="topbar-root" class="topbar">
    <div class="brand-left">
      <img id="brand-icon" class="brand-icon" src="" alt="icon" style="display:none;" />
      <span id="version-badge" class="badge">v1.0</span>
      <span id="adb-mode-pill" class="mode-pill-offline">ADB: 0 ONLINE</span>
    </div>
    <div style="display:flex;align-items:center;gap:6px;">
      <span id="sig-status" class="sig-pill">✓ Ed25519 Signed</span>
      <button id="preset-btn" class="btn-secondary" onclick="toggleLayout()">1/2 Cột ⇄</button>
    </div>
  </div>

  <div class="main-scroll">
    <!-- Top Multi-Device Table (Collapsible & Responsive Columns) -->
    <div id="device-section-root" class="device-section">
      <div class="sec-hdr" onclick="toggleCollapse('device_table')">
        <span>Danh sách Thiết bị ADB &amp; Cột Runtime</span>
        <span id="chevron-device_table">▾</span>
      </div>
      <div id="body-device_table" class="device-table-wrap">
        <table>
          <thead id="device-thead"></thead>
          <tbody id="device-tbody"></tbody>
        </table>
      </div>
    </div>

    <div id="workspace" class="workspace">
      <div id="left-pane-root" class="left-pane">
        <div class="tab-bar">
          <div class="tab-bar-tabs">
            <button id="tab-ctrl" class="tab-btn active" onclick="switchLeftTab('ctrl')">ĐIỀU KHIỂN</button>
            <button id="tab-util" class="tab-btn" onclick="switchLeftTab('util')">TIỆN ÍCH</button>
            <button id="tab-info" class="tab-btn" onclick="switchLeftTab('info')">MODULES</button>
          </div>
          <span style="font-size:10px;color:var(--text-muted);cursor:pointer;"
            onclick="toggleCollapse('task_checklist')" id="chevron-task_checklist">▾</span>
        </div>
        <div id="left-body" class="pane-body"></div>
      </div>

      <div id="right-pane-root" class="right-pane">
        <div class="tab-bar">
          <div class="tab-bar-tabs">
            <button id="tab-log" class="tab-btn active" onclick="switchRightTab('log')">NHẬT KÝ</button>
            <button id="tab-cfg" class="tab-btn" onclick="switchRightTab('cfg')">CÀI ĐẶT (⚙)</button>
          </div>
          <span style="font-size:10px;color:var(--text-muted);cursor:pointer;" onclick="toggleCollapse('quick_log')"
            id="chevron-quick_log">▾</span>
        </div>
        <div id="right-log" class="console-box"></div>
        <div id="right-cfg" class="pane-body" style="display:none;"></div>
      </div>
    </div>
  </div>

  <div id="footer-root" class="footer">
    <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
      <button class="btn-primary" onclick="runAllEnabledTasks(false)">▶ CHẠY NHIỆM VỤ (ADB THẬT)</button>
      <button id="btn-run-testkit" class="btn-testkit" onclick="runAllEnabledTasks(true)">🧪 CHẠY TESTKIT (MÔ PHỎNG)</button>
      <button class="btn-secondary" onclick="refreshDevices()">🔄 Quét ADB</button>
    </div>
    <div id="footer-meta" style="color:var(--text-muted);font-size:11px;">
      Isolated Mini Runtime
    </div>
  </div>

  <script>
    let STATE = {
      bootstrap: null,
      leftTab: 'ctrl',
      rightTab: 'log',
      selectedTaskForSettings: null,
      taskStates: {},
      logs: [],
      singleCol: false,
      collapsed: {},
      liveEnvelopes: {},
      testkitEnvelopes: {},
      streamSeqs: {},
      seqStats: {
        applied: 0,
        duplicatesIgnored: 0,
        staleIgnored: 0,
        gapsRecovered: 0,
        reconnectSyncs: 0
      }
    };

    async function invokeTauri(cmd, args = {}) {
      if (window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke) {
        return await window.__TAURI_INTERNALS__.invoke(cmd, args);
      }
      throw new Error("Tauri IPC not available");
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatVarDisplayValue(val) {
      if (val === undefined || val === null) return '';
      if (typeof val === 'object') return JSON.stringify(val);
      return String(val);
    }

    function resolveCellEnvelope(varKey) {
      const liveEnv = STATE.liveEnvelopes[varKey];
      const tkEnv = STATE.testkitEnvelopes[varKey];
      // Rule: verified LIVE data NEVER gets overridden or hidden by TESTKIT
      if (liveEnv && (liveEnv.source === 'LIVE_ADB_OCR' || liveEnv.source === 'LIVE_STATE') && liveEnv.verified) {
        return liveEnv;
      }
      if (tkEnv) return tkEnv;
      if (liveEnv) return liveEnv;
      const flat = STATE.bootstrap?.runtimeVars?.[varKey];
      if (flat !== undefined && flat !== null) {
        return {
          name: varKey,
          value: flat,
          source: 'LEGACY_UNVERIFIED',
          verified: false,
          confidence: null,
          seq: 0
        };
      }
      return null;
    }

    function provenanceBadgeHtml(env) {
      if (!env) return '';
      if (env.source === 'LIVE_ADB_OCR' || env.source === 'LIVE_STATE') {
        const confTxt = typeof env.confidence === 'number' ? ` ${Math.round(env.confidence * 100)}%` : '';
        if (env.verified) {
          return `<span class="prov-pill prov-live-ok">LIVE ✓${confTxt}</span>`;
        }
        return `<span class="prov-pill prov-live-unverified">LIVE · Chưa xác minh${confTxt}</span>`;
      }
      if (env.source === 'TESTKIT_MOCK') {
        return `<span class="prov-pill prov-testkit">TESTKIT · Mô phỏng</span>`;
      }
      if (env.source === 'LEGACY_UNVERIFIED') {
        return `<span class="prov-pill prov-legacy">LEGACY · Chưa xác minh</span>`;
      }
      return `<span class="prov-pill prov-legacy">Chưa xác minh</span>`;
    }

    function applyEnvelopeToLocalMap(env) {
      if (!env || !env.name) return false;
      const isTk = env.source === 'TESTKIT_MOCK';
      const targetMap = isTk ? STATE.testkitEnvelopes : STATE.liveEnvelopes;
      const existing = targetMap[env.name];
      if (existing && (env.seq || 0) < (existing.seq || 0)) {
        STATE.seqStats.staleIgnored += 1;
        return false;
      }
      targetMap[env.name] = env;
      if (!STATE.bootstrap) return true;
      if (!STATE.bootstrap.runtimeVars) STATE.bootstrap.runtimeVars = {};
      if (!isTk || !STATE.liveEnvelopes[env.name]?.verified) {
        STATE.bootstrap.runtimeVars[env.name] = env.value;
      }
      return true;
    }

    async function syncRuntimeSnapshotFromSqlite(reason = 'manual') {
      if (!STATE.bootstrap) return null;
      try {
        const snap = await invokeTauri('mini_get_runtime_snapshot', {
          sinceSeqByStream: STATE.streamSeqs
        });
        STATE.seqStats.reconnectSyncs += 1;
        if (Array.isArray(snap.missedEvents)) {
          for (const ev of snap.missedEvents) {
            for (const env of (ev.deltas || [])) {
              applyEnvelopeToLocalMap(env);
            }
          }
        }
        for (const [k, env] of Object.entries(snap.liveEnvelopes || {})) {
          STATE.liveEnvelopes[k] = env;
        }
        for (const [k, env] of Object.entries(snap.testkitEnvelopes || {})) {
          STATE.testkitEnvelopes[k] = env;
        }
        for (const [sid, s] of Object.entries(snap.streamSeqs || {})) {
          STATE.streamSeqs[sid] = Math.max(STATE.streamSeqs[sid] || 0, Number(s) || 0);
        }
        renderDeviceTable();
        addLog(`[SnapshotSync:${reason}] Đồng bộ seq=${JSON.stringify(STATE.streamSeqs)} (${snap.missedEvents?.length || 0} missed events).`);
        return snap;
      } catch (e) {
        addLog(`[SnapshotSync:${reason}] Lỗi: ${e}`);
        return null;
      }
    }

    async function applyIncomingDeltaPayload(payload) {
      if (!payload || !payload.streamId || typeof payload.seq !== 'number') return;
      const sid = payload.streamId;
      const curSeq = STATE.streamSeqs[sid] || 0;

      if (payload.seq <= curSeq) {
        STATE.seqStats.duplicatesIgnored += 1;
        addLog(`[SeqGuard] Bỏ qua sự kiện trùng/cũ: ${sid} seq=${payload.seq} <= ${curSeq}`);
        return;
      }
      if (payload.seq > curSeq + 1) {
        STATE.seqStats.gapsRecovered += 1;
        addLog(`[SeqGuard] Phát hiện thiếu seq ${curSeq + 1}..${payload.seq - 1} trên ${sid}, tải lại snapshot SQLite...`);
        await syncRuntimeSnapshotFromSqlite('gap_detected');
        return;
      }

      let anyApplied = false;
      for (const env of (payload.deltas || [])) {
        if (applyEnvelopeToLocalMap(env)) anyApplied = true;
      }
      STATE.streamSeqs[sid] = payload.seq;
      STATE.seqStats.applied += 1;
      if (anyApplied) {
        renderDeviceTable();
        const names = (payload.deltas || []).map(d => `${d.name}=${formatVarDisplayValue(d.value)} [${d.source}]`).join(', ');
        addLog(`[Realtime seq=${payload.seq}] ${names}`);
      }
    }

    window.__fpRuntimeTestApi = {
      syncSnapshot: syncRuntimeSnapshotFromSqlite,
      handleIncomingDelta: applyIncomingDeltaPayload,
      getStateSummary: () => ({
        streamSeqs: { ...STATE.streamSeqs },
        seqStats: { ...STATE.seqStats },
        liveEnvelopes: STATE.liveEnvelopes,
        testkitEnvelopes: STATE.testkitEnvelopes
      })
    };

    function isHidden(secId) {
      const hidden = STATE.bootstrap?.uiSchema?.hiddenComponents || [];
      return hidden.includes(secId);
    }

    function applySchemaLayout() {
      const b = STATE.bootstrap;
      if (!b) return;
      const schema = b.uiSchema;
      const vars = schema.initialRuntimeVars || {};
      const density = vars.__uiCompactDensity || (schema.layoutPreset === 'expanded' ? 'comfortable' : 'compact');
      document.body.classList.toggle('density-compact', density === 'compact');

      const hiddenHeader = isHidden('header_bar');
      document.getElementById('topbar-root').classList.toggle('hidden', hiddenHeader);

      const hiddenDevice = isHidden('device_table');
      document.getElementById('device-section-root').classList.toggle('hidden', hiddenDevice);

      const hiddenTasks = isHidden('task_checklist');
      const hiddenUtils = isHidden('utilities_panel');
      const hiddenLeft = hiddenTasks && hiddenUtils;
      document.getElementById('left-pane-root').classList.toggle('hidden', hiddenLeft);
      document.getElementById('tab-ctrl').classList.toggle('hidden', hiddenTasks);
      document.getElementById('tab-util').classList.toggle('hidden', hiddenUtils);
      if (hiddenTasks && !hiddenUtils && STATE.leftTab === 'ctrl') {
        STATE.leftTab = 'util';
      }

      const hiddenLog = isHidden('quick_log');
      document.getElementById('right-pane-root').classList.toggle('hidden', hiddenLog);

      const hiddenFooter = isHidden('footer_controls') && isHidden('status_footer');
      document.getElementById('footer-root').classList.toggle('hidden', hiddenFooter);

      const ws = document.getElementById('workspace');
      ws.classList.remove('single-col', 'preset-expanded', 'no-right');
      if (hiddenLog) {
        ws.classList.add('no-right');
      } else if (STATE.singleCol || schema.layoutPreset === 'compact1_col') {
        ws.classList.add('single-col');
      } else if (schema.layoutPreset === 'expanded') {
        ws.classList.add('preset-expanded');
      }

      const logMaxH = Number(vars.__uiLogMaxHeightPx || 0);
      if (logMaxH > 0 && schema.layoutPreset !== 'expanded') {
        document.getElementById('right-log').style.maxHeight = `${logMaxH}px`;
      } else {
        document.getElementById('right-log').style.maxHeight = '';
      }
    }

    function toggleCollapse(secId) {
      STATE.collapsed[secId] = !STATE.collapsed[secId];
      const isCol = Boolean(STATE.collapsed[secId]);
      if (secId === 'device_table') {
        document.getElementById('body-device_table').classList.toggle('hidden', isCol);
      } else if (secId === 'task_checklist') {
        document.getElementById('left-body').classList.toggle('hidden', isCol);
      } else if (secId === 'quick_log') {
        document.getElementById('right-log').classList.toggle('hidden', isCol && STATE.rightTab === 'log');
      }
      const chev = document.getElementById('chevron-' + secId);
      if (chev) chev.textContent = isCol ? '▸' : '▾';
    }

    function addLog(msg) {
      const now = new Date().toTimeString().split(' ')[0];
      STATE.logs.unshift({ ts: now, msg });
      renderLogs();
    }

    function renderLogs() {
      const box = document.getElementById('right-log');
      box.innerHTML = STATE.logs.map(l =>
        `<div class="log-line"><span class="log-ts">[${l.ts}]</span>${l.msg}</div>`
      ).join('');
    }

    function toggleLayout() {
      STATE.singleCol = !STATE.singleCol;
      applySchemaLayout();
    }

    function switchLeftTab(tab) {
      STATE.leftTab = tab;
      ['ctrl', 'util', 'info'].forEach(t => {
        document.getElementById('tab-' + t).classList.toggle('active', t === tab);
      });
      renderLeftPane();
    }

    function switchRightTab(tab) {
      STATE.rightTab = tab;
      document.getElementById('tab-log').classList.toggle('active', tab === 'log');
      document.getElementById('tab-cfg').classList.toggle('active', tab === 'cfg');
      document.getElementById('right-log').style.display = tab === 'log' ? 'block' : 'none';
      document.getElementById('right-cfg').style.display = tab === 'cfg' ? 'block' : 'none';
      if (tab === 'cfg') renderSettingsPane();
    }

    function openTaskSettings(taskId) {
      STATE.selectedTaskForSettings = taskId;
      switchRightTab('cfg');
    }

    function visibleDeviceColumns() {
      const cols = STATE.bootstrap?.uiSchema?.deviceColumns || [];
      const w = window.innerWidth || 960;
      return cols.filter(c => !c.minWindowWidth || w >= c.minWindowWidth);
    }

    function renderDeviceTable() {
      const b = STATE.bootstrap;
      if (!b) return;
      const cols = visibleDeviceColumns();
      const vars = b.runtimeVars || {};

      let headHtml = `<tr><th>[✓] Thiết bị ADB</th><th>Package Game</th><th>Trạng thái</th>`;
      for (const c of cols) headHtml += `<th>${c.label}</th>`;
      headHtml += `</tr>`;
      document.getElementById('device-thead').innerHTML = headHtml;

      const devices = b.devices || [];
      const readyCount = devices.filter(d => d.connection_state === 'ready').length;
      const pill = document.getElementById('adb-mode-pill');
      if (readyCount > 0) {
        pill.className = 'mode-pill-live';
        pill.textContent = `LIVE ADB: ${readyCount} ONLINE`;
      } else {
        pill.className = 'mode-pill-offline';
        pill.textContent = `ADB: 0 ONLINE (OFFLINE)`;
      }

      if (devices.length === 0) {
        document.getElementById('device-tbody').innerHTML = `<tr>
          <td class="state-offline">Chưa có thiết bị kết nối</td>
          <td style="color:var(--text-muted);font-family:Consolas;">${escapeHtml(b.manifest.project.gamePackageId)}</td>
          <td class="state-offline">OFFLINE</td>
          ${cols.map(c => {
            const env = resolveCellEnvelope(c.runtimeVarKey);
            if (!env || env.value === undefined || env.value === null) {
              return `<td style="color:var(--text-muted);font-style:italic;" title="Biến: ${escapeHtml(c.runtimeVarKey)} (Chưa có dữ liệu)">Chưa xác minh</td>`;
            }
            const disp = escapeHtml(formatVarDisplayValue(env.value));
            const valColor = env.source === 'TESTKIT_MOCK'
              ? '#fbbf24'
              : (env.verified ? (c.badgeColor || '#3bc38d') : 'var(--accent)');
            const metaTitle = `Biến: ${c.runtimeVarKey} | Nguồn: ${env.source} | Verified: ${env.verified} | Seq: ${env.seq || 0} | Job: ${env.jobId || '-'} | Lúc: ${env.updatedAtUtc || '-'}`;
            return `<td data-var-key="${escapeHtml(c.runtimeVarKey)}" data-var-source="${escapeHtml(env.source)}" style="color:${valColor};font-weight:700;" title="${escapeHtml(metaTitle)}"><span>${disp}</span>${provenanceBadgeHtml(env)}</td>`;
          }).join('')}
        </tr>`;
        return;
      }

      let bodyHtml = '';
      for (const d of devices) {
        const online = d.connection_state === 'ready';
        bodyHtml += `<tr class="${online ? 'active-row' : ''}">
          <td><input type="checkbox" ${online ? 'checked' : 'disabled'} /> <b>${escapeHtml(d.alias || d.id)} (${escapeHtml(d.id)})</b></td>
          <td style="color:var(--text-muted);font-family:Consolas;">${escapeHtml(b.manifest.project.gamePackageId)}</td>
          <td class="${online ? 'state-online' : 'state-offline'}">${online ? 'ONLINE (LIVE)' : escapeHtml(d.connection_state.toUpperCase())}</td>`;
        for (const c of cols) {
          const env = resolveCellEnvelope(c.runtimeVarKey);
          if (!env || env.value === undefined || env.value === null) {
            bodyHtml += `<td style="color:var(--text-muted);font-style:italic;" title="Key: ${escapeHtml(c.runtimeVarKey)} (Chưa xác minh)">Chưa xác minh</td>`;
          } else {
            const disp = escapeHtml(formatVarDisplayValue(env.value));
            const valColor = env.source === 'TESTKIT_MOCK'
              ? '#fbbf24'
              : (env.verified ? (c.badgeColor || '#3bc38d') : 'var(--accent)');
            const metaTitle = `Key: ${c.runtimeVarKey} | Nguồn: ${env.source} | Verified: ${env.verified} | Seq: ${env.seq || 0}`;
            bodyHtml += `<td data-var-key="${escapeHtml(c.runtimeVarKey)}" data-var-source="${escapeHtml(env.source)}" style="color:${valColor};font-weight:700;" title="${escapeHtml(metaTitle)}"><span>${disp}</span>${provenanceBadgeHtml(env)}</td>`;
          }
        }
        bodyHtml += `</tr>`;
      }
      document.getElementById('device-tbody').innerHTML = bodyHtml;
    }

    function renderLeftPane() {
      const b = STATE.bootstrap;
      const container = document.getElementById('left-body');
      if (!b) return;

      if (STATE.leftTab === 'ctrl') {
        const cats = {};
        for (const c of b.uiSchema.taskCategories) cats[c.id] = c;
        const sortedTasks = [...b.uiSchema.tasks].sort((a, x) => a.priority - x.priority);

        container.innerHTML = sortedTasks.map(t => {
          const cat = cats[t.categoryId] || { shortTag: '[TASK]', colorHex: '#38bdf8' };
          const st = STATE.taskStates[t.id] || { enabled: t.defaultEnabled, status: 'Chưa làm', cls: '' };
          const hasSettings = t.settingsSchema && t.settingsSchema.length > 0;
          return `<div class="task-row">
            <div class="task-left">
              <input type="checkbox" ${st.enabled ? 'checked' : ''} onchange="toggleTask('${t.id}', this.checked)" />
              <span class="cat-tag" style="background:${cat.colorHex}22;color:${cat.colorHex};border:1px solid ${cat.colorHex}66;">
                ${cat.shortTag}
              </span>
              <span class="task-title">${t.title}</span>
            </div>
            <div class="task-right">
              <span class="status-pill ${st.cls}">${st.status}</span>
              <button class="icon-btn" title="Chạy trên ADB thật" onclick="runSingleTask('${t.id}', false)">▶</button>
              <button class="icon-btn" title="Chạy TestKit (Mô phỏng)" onclick="startTaskBackground('${t.id}', true)">🧪</button>
              ${hasSettings ? `<button class="icon-btn" title="Cài đặt tham số" onclick="openTaskSettings('${t.id}')">⚙</button>` : ''}
            </div>
          </div>`;
        }).join('');
      } else if (STATE.leftTab === 'util') {
        const activeModules = new Set(
          b.manifest.moduleStates.filter(m => m.packagedInRelease && m.activeAndInitialized).map(m => m.moduleId)
        );
        container.innerHTML = b.uiSchema.utilities
          .filter(u => !u.requiredModule || activeModules.has(u.requiredModule))
          .map(u => `<div class="setting-card">
            <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
              <input type="checkbox" ${u.defaultEnabled ? 'checked' : ''} />
              <b>${u.label}</b>
            </label>
          </div>`).join('');
      } else {
        container.innerHTML = b.manifest.moduleStates.map(m => `
          <div class="setting-card">
            <div style="display:flex;justify-content:space-between;">
              <b>${m.displayName} (${m.moduleId})</b>
              <span class="badge" style="color:${m.packagedInRelease ? 'var(--success)' : 'var(--danger)'};border-color:${m.packagedInRelease ? 'var(--success)' : 'var(--danger)'}">
                ${m.packagedInRelease ? 'PACKAGED & ACTIVE' : 'NOT PACKAGED'}
              </span>
            </div>
            <div style="color:var(--text-muted);font-size:10.5px;margin-top:4px;">${m.technicalNote}</div>
          </div>
        `).join('');
      }
    }

    function renderSettingsPane() {
      const b = STATE.bootstrap;
      const box = document.getElementById('right-cfg');
      if (!b) return;
      const task = b.uiSchema.tasks.find(t => t.id === STATE.selectedTaskForSettings) || b.uiSchema.tasks[0];
      if (!task) return;
      let html = `<div class="setting-card">
        <div style="color:var(--accent);font-weight:700;margin-bottom:6px;">⚙ ${task.title}</div>`;
      if (!task.settingsSchema || task.settingsSchema.length === 0) {
        html += `<div>Nhiệm vụ sử dụng cấu hình mặc định chuẩn.</div>`;
      } else {
        for (const f of task.settingsSchema) {
          html += `<div class="setting-row"><span>${f.label}</span>`;
          if (f.fieldType === 'boolean') {
            html += `<input type="checkbox" ${f.defaultValue ? 'checked' : ''} />`;
          } else if (f.fieldType === 'select' && f.options) {
            html += `<select>${f.options.map(o => `<option ${o === f.defaultValue ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
          } else {
            html += `<input type="number" value="${f.defaultValue}" style="width:70px;" />`;
          }
          html += `</div>`;
        }
      }
      html += `</div>`;
      box.innerHTML = html;
    }

    function toggleTask(taskId, checked) {
      if (!STATE.taskStates[taskId]) STATE.taskStates[taskId] = { enabled: checked, status: 'Chưa làm', cls: '' };
      else STATE.taskStates[taskId].enabled = checked;
    }

    async function startTaskBackground(taskId, useDemoMock = false) {
      STATE.taskStates[taskId] = { enabled: true, status: 'Đang làm', cls: 'running' };
      renderLeftPane();
      addLog(`Khởi chạy bất đồng bộ '${taskId}' (${useDemoMock ? 'TESTKIT_MOCK' : 'LIVE ADB'})...`);
      try {
        const ack = await invokeTauri('mini_start_task', { taskId, useDemoMock });
        addLog(`[StartAck] Task=${ack.taskId} | Mode=${ack.isSimulatedDemo ? 'TESTKIT_MOCK' : 'LIVE'} | Lúc=${ack.startedAtUtc}`);
        return ack;
      } catch (e) {
        STATE.taskStates[taskId] = { enabled: true, status: 'Lỗi / Offline', cls: 'err' };
        renderLeftPane();
        addLog(`✗ Từ chối giả lập (Fail-Closed): ${e}`);
        throw e;
      }
    }

    async function runSingleTask(taskId, useDemoMock = false) {
      STATE.taskStates[taskId] = { enabled: true, status: 'Đang làm', cls: 'running' };
      renderLeftPane();
      addLog(`Gửi lệnh chạy '${taskId}' (Chế độ: ${useDemoMock ? 'TESTKIT_MOCK' : 'LIVE ADB'})...`);
      try {
        const res = await invokeTauri('mini_run_task', { taskId, useDemoMock });
        STATE.taskStates[taskId] = {
          enabled: true,
          status: res.state === 'Succeeded' ? 'Hoàn thành' : res.state,
          cls: res.state === 'Succeeded' ? 'done' : ''
        };
        await syncRuntimeSnapshotFromSqlite('task_complete');
        renderLeftPane();
        addLog(`✓ Hoàn tất '${taskId}' trên ${res.driverUsed}: ${res.eventsCount} bước (${res.state})`);
      } catch (e) {
        STATE.taskStates[taskId] = { enabled: true, status: 'Lỗi / Offline', cls: 'err' };
        renderLeftPane();
        addLog(`✗ Từ chối giả lập (Fail-Closed): ${e}`);
      }
    }

    async function runAllEnabledTasks(useDemoMock = false) {
      if (!STATE.bootstrap) return;
      for (const t of STATE.bootstrap.uiSchema.tasks) {
        const st = STATE.taskStates[t.id];
        if (!st || st.enabled) {
          if (useDemoMock) {
            await startTaskBackground(t.id, true);
          } else {
            await runSingleTask(t.id, false);
          }
        }
      }
    }

    async function refreshDevices() {
      try {
        const devs = await invokeTauri('mini_list_devices');
        if (STATE.bootstrap) {
          STATE.bootstrap.devices = devs;
          renderDeviceTable();
          addLog(`Quét ADB lúc ${new Date().toLocaleTimeString()}: ${devs.length} thiết bị.`);
        }
      } catch (e) {
        addLog(`Lỗi quét ADB: ${e}`);
      }
    }

    async function registerTauriEventListeners() {
      const tauriEvt = window.__TAURI__?.event;
      if (tauriEvt && typeof tauriEvt.listen === 'function') {
        await tauriEvt.listen('mini://runtime-var-delta', (event) => {
          applyIncomingDeltaPayload(event.payload);
        });
        await tauriEvt.listen('mini://task-progress', (event) => {
          const p = event.payload || {};
          if (p.taskId && p.state === 'Failed') {
            STATE.taskStates[p.taskId] = { enabled: true, status: 'Lỗi', cls: 'err' };
            renderLeftPane();
            addLog(`✗ Lỗi tác vụ '${p.taskId}': ${p.error || 'Unknown'}`);
          } else if (p.taskId && p.nodeId) {
            const st = STATE.taskStates[p.taskId] || { enabled: true };
            STATE.taskStates[p.taskId] = { ...st, status: 'Đang làm', cls: 'running' };
            renderLeftPane();
          }
        });
        addLog('[EventStream] Đã kết nối mini://runtime-var-delta & mini://task-progress');
      } else {
        addLog('[EventStream] Cảnh báo: không tìm thấy window.__TAURI__.event.listen');
      }
    }

    async function init() {
      try {
        const data = await invokeTauri('mini_get_bootstrap');
        STATE.bootstrap = data;
        STATE.liveEnvelopes = { ...(data.liveEnvelopes || {}) };
        STATE.testkitEnvelopes = { ...(data.testkitEnvelopes || {}) };
        STATE.streamSeqs = { ...(data.streamSeqs || {}) };

        document.documentElement.style.setProperty('--accent', data.uiSchema.themeAccentHex || '#38bdf8');
        document.documentElement.style.setProperty('--header-bg', data.uiSchema.headerBgHex || '#141c28');
        document.getElementById('version-badge').textContent = `${data.manifest.project.name} • ${data.uiSchema.versionBadge}`;
        document.title = data.uiSchema.windowTitle;

        if (data.iconBase64) {
          const img = document.getElementById('brand-icon');
          img.src = data.iconBase64;
          img.style.display = 'block';
        }
        document.getElementById('footer-meta').textContent =
          `KeyID: ${data.keyId} | Preset: ${data.uiSchema.layoutPreset} | runtime_${data.manifest.project.slug}.db`;

        const initCollapsed = data.uiSchema.initialRuntimeVars?.__uiCollapsedSections || [];
        for (const sec of initCollapsed) {
          STATE.collapsed[sec] = true;
        }
        if (data.uiSchema.layoutPreset === 'compact1_col') {
          STATE.singleCol = true;
        }

        for (const t of data.uiSchema.tasks) {
          STATE.taskStates[t.id] = { enabled: t.defaultEnabled, status: 'Chưa làm', cls: '' };
        }

        applySchemaLayout();
        for (const sec of initCollapsed) {
          const prev = STATE.collapsed[sec];
          STATE.collapsed[sec] = false;
          if (prev) toggleCollapse(sec);
        }

        await registerTauriEventListeners();
        renderDeviceTable();
        renderLeftPane();
        renderSettingsPane();
        addLog(`Khởi động ${data.uiSchema.windowTitle} (${data.uiSchema.layoutPreset})`);
        addLog(`Chữ ký RFC 8032 (${data.signatureAlgorithm}): HỢP LỆ`);
        addLog(`Trạng thái ADB thực tế: ${data.devices.length} máy kết nối.`);
        addLog(`[Snapshot] Live=${Object.keys(STATE.liveEnvelopes).length}, TestKit=${Object.keys(STATE.testkitEnvelopes).length}, Seqs=${JSON.stringify(STATE.streamSeqs)}`);
      } catch (e) {
        addLog(`LỖI XÁC THỰC BUNDLE: ${e}`);
      }
    }

    window.addEventListener('focus', () => {
      syncRuntimeSnapshotFromSqlite('window_focus');
    });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        syncRuntimeSnapshotFromSqlite('visibility_visible');
      }
    });
    window.addEventListener('resize', () => { if (STATE.bootstrap) renderDeviceTable(); });
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>

</html>

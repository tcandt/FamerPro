  <rect x="385" y="326" width="350" height="80" rx="8" fill="#132D24" stroke="#10B981" stroke-width="1.8"/>
  <text x="400" y="348" fill="#6EE7B7" font-size="13.5" font-weight="700">accounts (+project_id)</text>

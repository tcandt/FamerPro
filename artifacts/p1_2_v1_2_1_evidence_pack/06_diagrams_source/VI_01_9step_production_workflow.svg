  <rect x="617.6" y="226.0" width="104.8" height="15.0" rx="3" fill="#0D131D" stroke="#E7B15B" stroke-width="1"/>
  <text x="670.0" y="236.7" text-anchor="middle" fill="#E7B15B" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="9.5" font-weight="700">Bước 4 -&gt; Bước 5</text>
<line x1="319" y1="308" x2="344" y2="308" stroke="#E7B15B" stroke-width="2" marker-end="url(#arrow-amber)"/>

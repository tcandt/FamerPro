  <rect x="877.6" y="371.0" width="104.8" height="15.0" rx="3" fill="#0D131D" stroke="#3BC38D" stroke-width="1"/>
  <text x="930.0" y="381.7" text-anchor="middle" fill="#3BC38D" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="9.5" font-weight="700">Bước 8 -&gt; Bước 9</text>
</svg>
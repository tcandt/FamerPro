  <text x="22" y="25" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18.5" font-weight="700">SƠ ĐỒ IV.5 — ADB &amp; EMULATOR ADAPTER ARCHITECTURE</text>
  <text x="22" y="45" fill="#9FB2CC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="500">Kiến trúc điều khiển thiết bị Android không nội suy chuỗi shell, tích hợp Generation Fencing và chuẩn hóa tọa độ xoay</text>
  
  <rect x="18" y="72" width="864" height="430" rx="8" fill="#111927" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4,2"/>
  <rect x="30" y="61" width="557" height="21" rx="4" fill="#16202F" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="38" y="76" fill="#38BDF8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.2" font-weight="700">RUST HOST ADB &amp; EMULATOR DRIVER STACK (crates/fp-adb + crates/fp-device)</text>
<rect x="36" y="100" width="402" height="118" rx="6" fill="#152334" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="36" y="100" width="5" height="118" rx="2" fill="#38BDF8"/>
  <text x="50" y="120" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.2" font-weight="700">1. DeviceActor &amp; Generation Fencing (fp-device)</text>
  <text x="50" y="137" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• Mỗi thiết bị Android có 1 Actor riêng xử lý tuần tự lệnh</text>
  <text x="50" y="151.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• Cấp phát `generation: u64` tăng dần mỗi lần acquire lease</text>
  <text x="50" y="166.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="9.74">• Mọi lệnh mang generation cũ bị từ chối ngay lập tức (Stale Command Guard)</text>
  <text x="50" y="180.5" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.2">test_generation_fencing &amp; test_device_actor_operations (PASS)</text>
<rect x="462" y="100" width="402" height="118" rx="6" fill="#1B1E32" stroke="#B291F7" stroke-width="1.5"/>
  <rect x="462" y="100" width="5" height="118" rx="2" fill="#B291F7"/>
  <text x="476" y="120" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.12" font-weight="700">2. Geometry &amp; Orientation Normalizer (fp-device + fp-actions)</text>
  <text x="476" y="137" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.15">• Truy vấn `wm size` (1280x720) và chiều xoay màn hình (0/90/180/270 độ)</text>
  <text x="476" y="151.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• Chuyển đổi hệ tọa độ chuẩn hóa giữa Portrait và Landscape</text>
  <text x="476" y="166.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• Đảm bảo tọa độ mẫu Vision khớp chính xác với tọa độ `input tap`</text>
  <text x="476" y="180.5" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.2">test_point_rotation_and_landscape_transform (PASS)</text>
<rect x="36" y="236" width="828" height="120" rx="6" fill="#132524" stroke="#3BC38D" stroke-width="1.5"/>
  <rect x="36" y="236" width="5" height="120" rx="2" fill="#3BC38D"/>
  <text x="50" y="256" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.2" font-weight="700">3. Secure AdbRunner — Zero Raw Shell Interpolation (crates/fp-adb — AGENTS.md Rule #3)</text>
  <text x="50" y="273" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• Thực thi hoàn toàn qua `tokio::process::Command::new(&amp;adb_path).args(&amp;[&quot;-s&quot;, serial, ...])`</text>
  <text x="50" y="287.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• Tuyệt đối không nối chuỗi shell (`cmd /c` hay `sh -c`), chặn đứng nguy cơ Command Injection từ serial hoặc package name</text>
  <text x="50" y="302.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• Tự động phát hiện `./bin/adb.exe` đóng gói kèm Mini Tool trước khi tìm trong PATH hệ thống</text>
  <text x="50" y="316.5" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.2">Bằng chứng: test_discover_adb_path &amp; test_parse_adb_devices_output (PASS)</text>
<rect x="36" y="374" width="402" height="112" rx="6" fill="#16202F" stroke="#2A3647" stroke-width="1.5"/>
  <rect x="36" y="374" width="5" height="112" rx="2" fill="#1878F5"/>
  <text x="50" y="394" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.2" font-weight="700">4. Unified USB / TCP &amp; LAN IP Scanner</text>
  <text x="50" y="411" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• Quét cổng giả lập cục bộ (127.0.0.1:5555..5585)</text>
  <text x="50" y="425.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• Quét dải IP LAN (`scanRange`) kết nối máy thật qua Wi-Fi ADB</text>
  <text x="50" y="440.0" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.2">adb connect &lt;ip&gt;:&lt;port&gt; với timeout kiểm soát chặt</text>
<rect x="462" y="374" width="402" height="112" rx="6" fill="#22211C" stroke="#E7B15B" stroke-width="1.5"/>
  <rect x="462" y="374" width="5" height="112" rx="2" fill="#E7B15B"/>
  <text x="476" y="394" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.7" font-weight="700">5. Emulator Instance Adapter (LDPlayer / Nox / BlueStacks)</text>
  <text x="476" y="411" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• Điều khiển vòng đời giả lập: Launch / Quit / Reboot instance</text>
  <text x="476" y="425.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.44">• Quản lý ứng dụng trên thiết bị: `monkey`/`am start`, `am force-stop`</text>
  <text x="476" y="440.0" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.2">Tích hợp tập trung tại khu vực 4. Device Lab</text>


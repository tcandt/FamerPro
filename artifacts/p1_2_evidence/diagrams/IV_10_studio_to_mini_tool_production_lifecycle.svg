  <text x="954" y="122" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700">Release #1: Auto_JX2_Mobile.exe (Độc lập 100%)</text>
  <text x="954" y="139" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• PE Icon riêng + PE RT_RCDATA #7777 PubKey + Signed Bundle #1</text>
  <text x="954" y="153.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Database riêng: `data/runtime_jx2-mobile.db`</text>
  <text x="954" y="168.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Đã kiểm chứng chạy độc lập khi FarmerPro Studio đóng hoàn toàn</text>
  <text x="954" y="182.5" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">SHA256: 55c051cba31c269c7d307301ac2f32e451f18773...</text>
<rect x="940" y="234" width="426" height="118" rx="6" fill="#142624" stroke="#3BC38D" stroke-width="1.5"/>

  <text x="954" y="254" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700">Release #2: Auto_Kingdom_SLG.exe (Độc lập 100%)</text>
  <text x="954" y="271" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• PE Icon riêng + PE RT_RCDATA #7777 PubKey + Signed Bundle #2</text>
  <text x="954" y="285.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Database riêng: `data/runtime_kingdom-slg.db`</text>
  <text x="954" y="300.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Đã kiểm chứng chạy độc lập &amp; NTFS Read-Only Fallback PASS</text>
  <text x="954" y="314.5" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">SHA256: 95732232077c0747fe611def3afba858327df6f4...</text>
<rect x="940" y="366" width="426" height="118" rx="6" fill="#152333" stroke="#38BDF8" stroke-width="1.5"/>

  <text x="954" y="386" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700">Release #N: Auto_&lt;NewGame&gt;.exe (Sẵn sàng mở rộng)</text>
  <text x="954" y="403" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Xuất bản trong ~1.1 giây từ `MiniToolPackager`</text>
  <text x="954" y="417.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Mỗi sản phẩm có nhận diện thương hiệu, bộ nhiệm vụ, cột OCR</text>
  <text x="954" y="432.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">  và phạm vi module hoàn toàn riêng biệt</text>
  <text x="954" y="446.5" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">Kiến trúc Nhà máy Phần mềm (Software Factory) Đích thực</text>

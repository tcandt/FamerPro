  <rect x="0" y="0" width="1400" height="520" rx="10" fill="#0D131D" stroke="#2A3647" stroke-width="2"/>
  <rect x="0" y="0" width="1400" height="56" rx="10" fill="#141C28"/>
  <line x1="0" y1="56" x2="1400" y2="56" stroke="#2A3647" stroke-width="1.5"/>
  <text x="22" y="25" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18.5" font-weight="700">SƠ ĐỒ IV.10 — STUDIO → MULTI-GAME MINI TOOL PRODUCTION LIFECYCLE</text>
  <text x="22" y="45" fill="#9FB2CC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="500">Một nền tảng FarmerPro Studio + 14 Rust Core Crates dùng chung sản xuất nhiều Mini Auto-Tools cho các game khác nhau</text>
  
  <rect x="18" y="72" width="380" height="430" rx="8" fill="#131826" stroke="#B291F7" stroke-width="1.5" stroke-dasharray="4,2"/>
  <rect x="30" y="61" width="327" height="21" rx="4" fill="#16202F" stroke="#B291F7" stroke-width="1.2"/>
  <text x="38" y="76" fill="#B291F7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700">1. UNCHANGED SHARED RUST CORE (14 CRATES)</text>
<rect x="34" y="102" width="348" height="382" rx="6" fill="#181E30" stroke="#B291F7" stroke-width="1.5"/>
  <rect x="34" y="102" width="5" height="382" rx="2" fill="#B291F7"/>
  <text x="48" y="122" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700">Zero Core Code Modification Across Games</text>
  <text x="48" y="139" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• fp-domain (Core Types &amp; Driver Traits)</text>
  <text x="48" y="153.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• fp-adb (Argv Command &amp; Discovery)</text>
  <text x="48" y="168.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• fp-device (DeviceActor &amp; Fencing)</text>
  <text x="48" y="182.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• fp-vision (Multiscale SSD &amp; WinRT OCR)</text>
  <text x="48" y="197.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• fp-actions (Safe Random Tap Policy)</text>
  <text x="48" y="211.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• fp-workflow-schema (JSON Graph Validator)</text>
  <text x="48" y="226.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• fp-workflow-runtime (State Machine Executor)</text>
  <text x="48" y="240.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• fp-scheduler (Leases &amp; Priority Queue)</text>
  <text x="48" y="255.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• fp-storage (SQLite WAL Persistence)</text>
  <text x="48" y="269.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• fp-security (Vault &amp; Secret Redaction)</text>
  <text x="48" y="284.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• fp-bundle-contract (5-State Modules &amp; UI Schema)</text>
  <text x="48" y="298.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• fp-bundle-verify (PE #7777 Ed25519 Verifier)</text>
  <text x="48" y="313.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">-----------------------------------------</text>
  <text x="48" y="327.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">Biên dịch 1 lần duy nhất thành:</text>
  <text x="48" y="342.0" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">target/release/fp-mini-runtime.exe</text>
  <text x="48" y="356.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">Tái sử dụng cho N tựa game khác nhau!</text>

  <rect x="426" y="72" width="470" height="430" rx="8" fill="#111927" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4,2"/>
  <rect x="438" y="61" width="313" height="21" rx="4" fill="#16202F" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="446" y="76" fill="#38BDF8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700">2. FARMERPRO STUDIO MULTI-GAME PROJECTS</text>
<rect x="442" y="102" width="438" height="118" rx="6" fill="#22201A" stroke="#E7B15B" stroke-width="1.5"/>
  <rect x="442" y="102" width="5" height="118" rx="2" fill="#E7B15B"/>
  <text x="456" y="122" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700">Project A: Võ Hiệp Truyền Kỳ 2 Mobile (jx2-mobile)</text>
  <text x="456" y="139" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Package: `com.blackhole.jx2mobile` | Icon: `jx2/branding/icon.ico`</text>
  <text x="456" y="153.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Workflows: `wf-jx2-main-quest`, `wf-jx2-live-adb-probe` (4 PNGs)</text>
  <text x="456" y="168.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• UI Schema: Amber `#F59E0B`, 3 cột OCR (`Cấp`, `Vàng`, `Bạc`), 5 Tasks</text>
  <text x="456" y="182.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Modules (5): ADB, Vision/OCR, Account Vault, SOCKS5 Proxy, Watchdog</text>
<rect x="442" y="234" width="438" height="118" rx="6" fill="#142624" stroke="#3BC38D" stroke-width="1.5"/>
  <rect x="442" y="234" width="5" height="118" rx="2" fill="#3BC38D"/>
  <text x="456" y="254" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700">Project B: Kingdom Rise: Tactics SLG (kingdom-slg)</text>
  <text x="456" y="271" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Package: `com.kingdom.rise.slg` | Icon: `slg/branding/icon.ico`</text>
  <text x="456" y="285.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Workflows: `wf-slg-harvest-and-patrol` (3 PNGs)</text>
  <text x="456" y="300.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• UI Schema: Emerald `#10B981`, 4 cột OCR (`Thành`, `Lương`, `Gỗ`, `Quân`), 4 Tasks</text>
  <text x="456" y="314.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Modules (4): ADB, Vision/OCR, Account Vault, Watchdog (Proxy OFF)</text>
<rect x="442" y="366" width="438" height="118" rx="6" fill="#152333" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="442" y="366" width="5" height="118" rx="2" fill="#38BDF8"/>
  <text x="456" y="386" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700">Project N: Bất kỳ Tựa Game Android Mới (new-game-slug)</text>
  <text x="456" y="403" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Nhà phát triển chỉ cần tạo Project trên Studio UI:</text>
  <text x="456" y="417.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">  1. Cắt ảnh mẫu PNG từ Device Lab  2. Kéo thả Node trong Workflow Studio</text>
  <text x="456" y="432.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">  3. Cấu hình Task &amp; Cột OCR        4. Bấm `Build &amp; Xuất Mini Tool (.EXE)`</text>
  <text x="456" y="446.5" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">Không cần viết Rust, không sửa JSON tay, không chạy Cargo!</text>


  <rect x="0" y="0" width="1400" height="520" rx="10" fill="#0D131D" stroke="#2A3647" stroke-width="2"/>
  <rect x="0" y="0" width="1400" height="56" rx="10" fill="#141C28"/>
  <line x1="0" y1="56" x2="1400" y2="56" stroke="#2A3647" stroke-width="1.5"/>
  <text x="22" y="25" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18.5" font-weight="700">SƠ ĐỒ IV.3 — GAMEPROJECT DATA MODEL &amp; SQLITE MIGRATION V1 → V2 ER DIAGRAM</text>
  <text x="22" y="45" fill="#9FB2CC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="500">Mô hình dữ liệu đa dự án trong SQLite WAL: 6 bảng mới + mở rộng khóa ngoại project_id bảo toàn dữ liệu cũ</text>
  
  <rect x="18" y="72" width="1364" height="430" rx="8" fill="#101824" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4,2"/>
  <rect x="30" y="61" width="631" height="21" rx="4" fill="#16202F" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="38" y="76" fill="#38BDF8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700">SQLITE WAL MULTI-PROJECT SCHEMA V2 (Tương Thích Ngược 100% — Không Mất Dữ Liệu v1)</text>
<rect x="490" y="96" width="400" height="155" rx="6" fill="#16253A" stroke="#1878F5" stroke-width="1.5"/>
  <rect x="490" y="96" width="5" height="155" rx="2" fill="#38BDF8"/>
  <text x="504" y="116" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700">TABLE: projects (Root Entity - Mới ở P2)</text>
  <text x="504" y="133" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">id TEXT PRIMARY KEY       -- &#x27;proj-jx2-mobile-001&#x27;</text>
  <text x="504" y="147.5" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">slug TEXT UNIQUE NOT NULL -- &#x27;jx2-mobile&#x27;</text>
  <text x="504" y="162.0" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">name TEXT NOT NULL        -- &#x27;Võ Hiệp Truyền Kỳ 2&#x27;</text>
  <text x="504" y="176.5" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">game_package_id TEXT      -- &#x27;com.blackhole.jx2mobile&#x27;</text>
  <text x="504" y="191.0" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">version TEXT, exe_name TEXT, window_title TEXT</text>
  <text x="504" y="205.5" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">icon_rel_path TEXT, target_width_px INT, target_height_px INT</text>
  <text x="504" y="220.0" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">bundle_adb INT, project_dir_path TEXT, updated_at TEXT</text>
<rect x="36" y="96" width="390" height="118" rx="6" fill="#142426" stroke="#3BC38D" stroke-width="1.5"/>
  <rect x="36" y="96" width="5" height="118" rx="2" fill="#3BC38D"/>
  <text x="50" y="116" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700">TABLE: project_modules (5-State Config - Mới)</text>
  <text x="50" y="133" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">project_id TEXT REFERENCES projects(id)</text>
  <text x="50" y="147.5" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">module_id TEXT -- &#x27;mod.adb_core&#x27;, &#x27;mod.account_vault&#x27;...</text>
  <text x="50" y="162.0" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">packaged_in_release INT NOT NULL DEFAULT 1</text>
  <text x="50" y="176.5" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">enabled_by_default INT NOT NULL DEFAULT 1</text>
  <text x="50" y="191.0" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">config_json TEXT, PRIMARY KEY (project_id, module_id)</text>
<rect x="36" y="232" width="390" height="128" rx="6" fill="#1A1D30" stroke="#B291F7" stroke-width="1.5"/>
  <rect x="36" y="232" width="5" height="128" rx="2" fill="#B291F7"/>
  <text x="50" y="252" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700">TABLE: vision_templates (Project PNGs - Mới)</text>
  <text x="50" y="269" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">id TEXT PRIMARY KEY</text>
  <text x="50" y="283.5" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">project_id TEXT REFERENCES projects(id)</text>
  <text x="50" y="298.0" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">name TEXT, rel_path TEXT -- &#x27;templates/sys_apps.png&#x27;</text>
  <text x="50" y="312.5" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">width_px INT, height_px INT, source_crop_x/y INT</text>
  <text x="50" y="327.0" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">default_confidence REAL, sha256 TEXT NOT NULL</text>
<rect x="36" y="376" width="390" height="112" rx="6" fill="#22211C" stroke="#E7B15B" stroke-width="1.5"/>
  <rect x="36" y="376" width="5" height="112" rx="2" fill="#E7B15B"/>
  <text x="50" y="396" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700">TABLE: mini_tool_schemas (UI Schema - Mới)</text>
  <text x="50" y="413" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">project_id TEXT PRIMARY KEY REFERENCES projects(id)</text>
  <text x="50" y="427.5" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">schema_version INT NOT NULL DEFAULT 1</text>
  <text x="50" y="442.0" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">ui_schema_json TEXT NOT NULL -- MiniToolUiSchema</text>
  <text x="50" y="456.5" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">updated_at TEXT NOT NULL</text>
<rect x="954" y="96" width="410" height="126" rx="6" fill="#142426" stroke="#3BC38D" stroke-width="1.5"/>
  <rect x="954" y="96" width="5" height="126" rx="2" fill="#3BC38D"/>
  <text x="968" y="116" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700">TABLE: task_definitions (Task Library - Mới)</text>
  <text x="968" y="133" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">id TEXT PRIMARY KEY</text>
  <text x="968" y="147.5" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">project_id TEXT REFERENCES projects(id)</text>
  <text x="968" y="162.0" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">workflow_id TEXT REFERENCES workflows(id)</text>
  <text x="968" y="176.5" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">category_id, category_short_tag, category_color_hex</text>
  <text x="968" y="191.0" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">title TEXT, priority INT, estimate_sec INT</text>
  <text x="968" y="205.5" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">settings_schema_json TEXT -- Dynamic task fields</text>
<rect x="954" y="238" width="410" height="126" rx="6" fill="#22211C" stroke="#E7B15B" stroke-width="1.5"/>
  <rect x="954" y="238" width="5" height="126" rx="2" fill="#E7B15B"/>
  <text x="968" y="258" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700">TABLE: project_releases (Build History - Mới)</text>
  <text x="968" y="275" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">id TEXT PRIMARY KEY, project_id TEXT REFERENCES projects(id)</text>
  <text x="968" y="289.5" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">version TEXT, output_dir_path TEXT, exe_path TEXT</text>
  <text x="968" y="304.0" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">exe_size_bytes INT, exe_sha256 TEXT, key_id TEXT</text>
  <text x="968" y="318.5" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">publisher_public_key_hex TEXT, pe_rcdata_pubkey_id INT (7777)</text>
  <text x="968" y="333.0" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">signature_ed25519_hex TEXT, build_report_json TEXT</text>
<rect x="490" y="272" width="400" height="108" rx="6" fill="#16202F" stroke="#2A3647" stroke-width="1.5"/>
  <rect x="490" y="272" width="5" height="108" rx="2" fill="#38BDF8"/>
  <text x="504" y="292" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700">EXISTING TABLES: workflows &amp; workflow_versions</text>
  <text x="504" y="309" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">id TEXT PRIMARY KEY, name TEXT, current_version INT</text>
  <text x="504" y="323.5" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">+ ALTER ADD project_id TEXT REFERENCES projects(id)</text>
  <text x="504" y="338.0" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">+ ALTER ADD category TEXT NOT NULL DEFAULT &#x27;Chung&#x27;</text>
  <text x="504" y="352.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">Auto-migrates all existing JX2 workflows to &#x27;proj-jx2-mobile-001&#x27;</text>
<rect x="490" y="394" width="400" height="94" rx="6" fill="#16202F" stroke="#2A3647" stroke-width="1.5"/>
  <rect x="490" y="394" width="5" height="94" rx="2" fill="#F27883"/>
  <text x="504" y="414" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700">EXISTING TABLES: accounts, jobs, step_events, checkpoints</text>
  <text x="504" y="431" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">accounts: + ALTER ADD project_id TEXT REFERENCES projects(id)</text>
  <text x="504" y="445.5" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">jobs:     + ALTER ADD project_id TEXT REFERENCES projects(id)</text>
  <text x="504" y="460.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">step_events &amp; checkpoints link via job_id -&gt; jobs(id)</text>

  <text x="1101" y="129" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• Đọc khóa công khai gốc từ PE #7777</text>
  <text x="1101" y="143.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• Đối chiếu trusted_publisher.pub</text>
  <text x="1101" y="158.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• Xác thực chữ ký Ed25519 của bundle/</text>
  <text x="1101" y="172.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• Chặn đứng 5/5 kịch bản Tamper Suite</text>
  <text x="1101" y="187.0" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.2">0 phụ thuộc vào fp-builder (cargo tree)</text>

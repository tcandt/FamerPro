  <text x="1101" y="255" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• Dựng giao diện 100% từ ui-schema.json</text>
  <text x="1101" y="269.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• Áp dụng màu thương hiệu &amp; cột OCR động</text>
  <text x="1101" y="284.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• Hiển thị trung thực &#x27;Chưa OCR (-)&#x27;</text>
  <text x="1101" y="298.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• Ẩn hoàn toàn các Module không đóng gói</text>
  <text x="1101" y="313.0" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.2">Auto_JX2_Mobile.exe / Auto_Kingdom_SLG</text>

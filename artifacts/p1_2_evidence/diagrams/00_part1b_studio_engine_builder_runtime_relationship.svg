  <text x="388" y="72" fill="#B291F7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.2" font-weight="700">2. SHARED WORKFLOW ENGINE</text>
<rect x="382" y="92" width="292" height="114" rx="6" fill="#1B1E32" stroke="#B291F7" stroke-width="1.5"/>
  <rect x="382" y="92" width="5" height="114" rx="2" fill="#B291F7"/>
  <text x="396" y="112" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.2" font-weight="700">Core Graph &amp; Vision Crates</text>
  <text x="396" y="129" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• fp-workflow-schema (DAG Validator)</text>
  <text x="396" y="143.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• fp-workflow-runtime (State Machine)</text>
  <text x="396" y="158.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• fp-vision (Multiscale SSD + WinRT OCR)</text>
  <text x="396" y="172.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• fp-actions (18% Safe Random Tap Policy)</text>
  <text x="396" y="187.0" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.2">100% Mã nguồn Rust dùng chung</text>
<rect x="382" y="218" width="292" height="116" rx="6" fill="#152333" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="382" y="218" width="5" height="116" rx="2" fill="#38BDF8"/>
  <text x="396" y="238" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.2" font-weight="700">Device, Lease &amp; Storage Crates</text>
  <text x="396" y="255" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• fp-adb (Argv Command, Zero Shell String)</text>
  <text x="396" y="269.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• fp-device (DeviceActor + Gen Fencing)</text>
  <text x="396" y="284.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• fp-scheduler (Exclusive Per-Device Lease)</text>
  <text x="396" y="298.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• fp-storage (SQLite WAL + Online Backup)</text>
  <text x="396" y="313.0" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.2">Chạy giống hệt nhau ở Studio &amp; Mini Tool</text>
<rect x="382" y="346" width="292" height="120" rx="6" fill="#142624" stroke="#3BC38D" stroke-width="1.5"/>
  <rect x="382" y="346" width="5" height="120" rx="2" fill="#3BC38D"/>
  <text x="396" y="366" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.2" font-weight="700">Contract &amp; Security Guard Crates</text>
  <text x="396" y="383" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• fp-bundle-contract (Zero-Crypto Schema)</text>
  <text x="396" y="397.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• fp-bundle-verify (PE #7777 Verifier)</text>
  <text x="396" y="412.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• fp-security (CRED_MGR:// Vault &amp; Redact)</text>
  <text x="396" y="426.5" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.2">Liên kết tĩnh vào cả Studio &amp; Runtime</text>

  <rect x="728" y="68" width="305" height="412" rx="8" fill="#171A22" stroke="#E7B15B" stroke-width="1.5" stroke-dasharray="4,2"/>
  <rect x="740" y="57" width="202" height="21" rx="4" fill="#16202F" stroke="#E7B15B" stroke-width="1.2"/>
  <text x="748" y="72" fill="#E7B15B" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.2" font-weight="700">3. FP-BUILDER (PACKAGER)</text>
<rect x="742" y="92" width="277" height="114" rx="6" fill="#22211C" stroke="#E7B15B" stroke-width="1.5"/>
  <rect x="742" y="92" width="5" height="114" rx="2" fill="#E7B15B"/>
  <text x="756" y="112" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.2" font-weight="700">Pre-Flight &amp; Asset Guard (Step 1-4)</text>
  <text x="756" y="129" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• Kiểm tra toàn vẹn Workflow &amp; PNGs</text>
  <text x="756" y="143.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• Chặn Path Traversal (../)</text>
  <text x="756" y="158.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• Khóa ma trận Module 5 trạng thái</text>
  <text x="756" y="172.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• Sao chép binary mẫu fp-mini-runtime.exe</text>
  <text x="756" y="187.0" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.2">Chỉ tồn tại trong Studio &amp; fp-cli</text>
<rect x="742" y="218" width="277" height="116" rx="6" fill="#251920" stroke="#F27883" stroke-width="1.5"/>
  <rect x="742" y="218" width="5" height="116" rx="2" fill="#F27883"/>
  <text x="756" y="238" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.68" font-weight="700">PE Resource &amp; Ed25519 Signer (Step 5-7)</text>
  <text x="756" y="255" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• Win32 UpdateResourceW nhúng 7-layer Icon</text>
  <text x="756" y="269.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• Nhúng cứng 32-byte PubKey vào PE #7777</text>
  <text x="756" y="284.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• Đọc khóa bí mật từ %LOCALAPPDATA%</text>
  <text x="756" y="298.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• Ký chữ ký số RFC 8032 Ed25519 lên bundle/</text>
  <text x="756" y="313.0" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.2">SigningKey không bao giờ rời máy SX</text>
<rect x="742" y="346" width="277" height="120" rx="6" fill="#142624" stroke="#3BC38D" stroke-width="1.5"/>
  <rect x="742" y="346" width="5" height="120" rx="2" fill="#3BC38D"/>
  <text x="756" y="366" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.2" font-weight="700">Self-Verify &amp; Release Output (Step 8)</text>
  <text x="756" y="383" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• Đọc lại khóa từ PE RT_RCDATA #7777</text>
  <text x="756" y="397.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• Kiểm tra chữ ký &amp; bảng băm SHA-256</text>
  <text x="756" y="412.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• Đóng gói kèm ./bin/adb.exe + 2 DLLs</text>
  <text x="756" y="426.5" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.2">Xuất build-report.json (~1.1 giây)</text>


  <text x="1101" y="383" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• Chạy quy trình bằng Shared Engine</text>
  <text x="1101" y="397.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• Kết nối trực tiếp ./bin/adb.exe</text>
  <text x="1101" y="412.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• Tự chuyển SQLite sang %LOCALAPPDATA%</text>

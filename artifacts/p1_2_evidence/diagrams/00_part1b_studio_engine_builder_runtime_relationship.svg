  <text x="22" y="25" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18.5" font-weight="700">SƠ ĐỒ 1.2 — SƠ ĐỒ QUAN HỆ GIỮA STUDIO, WORKFLOW ENGINE, BUILDER VÀ MINI RUNTIME</text>
  <text x="22" y="45" fill="#9FB2CC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="500">Luồng chuyển giao đặc tả, liên kết biên dịch, cô lập khóa bí mật và thực thi độc lập giữa 4 phân hệ cốt lõi</text>
  
  <rect x="18" y="68" width="310" height="412" rx="8" fill="#111927" stroke="#1878F5" stroke-width="1.5" stroke-dasharray="4,2"/>
  <rect x="30" y="57" width="194" height="21" rx="4" fill="#16202F" stroke="#1878F5" stroke-width="1.2"/>
  <text x="38" y="72" fill="#38BDF8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.2" font-weight="700">1. FARMERPRO STUDIO IDE</text>
<rect x="32" y="92" width="282" height="110" rx="6" fill="#162438" stroke="#1878F5" stroke-width="1.5"/>
  <rect x="32" y="92" width="5" height="110" rx="2" fill="#38BDF8"/>
  <text x="46" y="112" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.2" font-weight="700">A. Authoring &amp; Design Layer</text>
  <text x="46" y="129" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• Quản lý Đa dự án GameProjectManifest</text>
  <text x="46" y="143.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• Kéo cắt mẫu ảnh PNG từ Device Lab</text>
  <text x="46" y="158.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• Thiết kế đồ thị Node trên React Flow</text>
  <text x="46" y="172.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• Cấu hình Task Library &amp; 5-State Modules</text>
  <text x="46" y="187.0" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.2">projects/&lt;slug&gt;/{workflows,templates}</text>
<rect x="32" y="214" width="282" height="114" rx="6" fill="#152333" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="32" y="214" width="5" height="114" rx="2" fill="#38BDF8"/>
  <text x="46" y="234" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.2" font-weight="700">B. Live Lab Testing &amp; Verification</text>
  <text x="46" y="251" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• Gửi đồ thị JSON xuống Workflow Engine</text>
  <text x="46" y="265.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• Thực thi thật trên LDPlayer/ADB</text>
  <text x="46" y="280.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• Thu thập 19 StepEvents &amp; ảnh Trước/Sau</text>
  <text x="46" y="294.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• Kiểm chứng Safe Tap 18% &amp; WinRT OCR</text>
  <text x="46" y="309.0" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.2">SQLite WAL farmerpro.db (Studio DB)</text>
<rect x="32" y="340" width="282" height="126" rx="6" fill="#22211C" stroke="#E7B15B" stroke-width="1.5"/>
  <rect x="32" y="340" width="5" height="126" rx="2" fill="#E7B15B"/>
  <text x="46" y="360" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.2" font-weight="700">C. Mini Tool UI Schema Designer</text>
  <text x="46" y="377" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• Thiết kế Branding, Màu sắc, Icon .ico</text>
  <text x="46" y="391.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• Cấu hình cột chỉ số OCR động &amp; Fallback</text>
  <text x="46" y="406.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• Xem trước trên Live Interactive Preview</text>
  <text x="46" y="420.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10.8">• Xuất đặc tả sang bộ đóng gói fp-builder</text>
  <text x="46" y="435.0" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.2">bundle/ui-schema.json</text>

  <rect x="368" y="68" width="320" height="412" rx="8" fill="#131826" stroke="#B291F7" stroke-width="1.5" stroke-dasharray="4,2"/>

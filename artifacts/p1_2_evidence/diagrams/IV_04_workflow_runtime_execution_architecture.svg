  <text x="22" y="25" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18.5" font-weight="700">SƠ ĐỒ IV.4 — WORKFLOW RUNTIME EXECUTION ARCHITECTURE</text>
  <text x="22" y="45" fill="#9FB2CC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="500">Máy trạng thái thực thi quy trình tự động hóa: Chụp PNG -&gt; Khớp mẫu SSD -&gt; Safe Random Tap 18% -&gt; WinRT OCR -&gt; Checkpoint</text>
  

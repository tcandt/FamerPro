<rect x="34" y="358" width="425" height="126" rx="6" fill="#1F201D" stroke="#E7B15B" stroke-width="1.5"/>
  <rect x="34" y="358" width="5" height="126" rx="2" fill="#E7B15B"/>
  <text x="48" y="378" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700">Cơ chế Thử lại &amp; Chống kẹt (Retry &amp; Backoff Engine)</text>
  <text x="48" y="395" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Nếu vision.find_image có score &lt; minConfidence (VD: &lt; 0.90):</text>
  <text x="48" y="409.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Kiểm tra attempt_no &lt;= max_retries (mặc định 3 lần, backoff 800ms)</text>
  <text x="48" y="424.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Tự động quay lại chụp khung hình mới trước khi đánh dấu step_failed</text>
  <text x="48" y="438.5" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">Đã kiểm chứng: test_executor_retry_logic (PASS)</text>
<rect x="482" y="358" width="435" height="126" rx="6" fill="#142423" stroke="#3BC38D" stroke-width="1.5"/>
  <rect x="482" y="358" width="5" height="126" rx="2" fill="#3BC38D"/>
  <text x="496" y="378" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700">Chính sách Chạm Ngẫu Nhiên An Toàn (Safe Random Tap Policy)</text>
  <text x="496" y="395" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Tuyệt đối KHÔNG hardcode tọa độ cố định (AGENTS.md Rule #5)</text>
  <text x="496" y="409.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Hộp khớp [74, 135, 88, 88] + marginRatio 0.18 -&gt; Vùng an toàn [90..146, 151..207]</text>
  <text x="496" y="424.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Điểm chạm thực tế trên LDPlayer: (111, 170) nằm gọn trong tâm an toàn</text>
  <text x="496" y="438.5" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">Đã kiểm chứng: test_safe_margin_shrink &amp; Live ADB (PASS)</text>
<rect x="940" y="358" width="426" height="126" rx="6" fill="#152231" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="940" y="358" width="5" height="126" rx="2" fill="#38BDF8"/>
  <text x="954" y="378" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700">Nhật ký Sự kiện Bước Toàn diện (SQLite WAL StepEvents)</text>
  <text x="954" y="395" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Mỗi Node phát sinh chuỗi sự kiện: command_sent -&gt; device_ack -&gt;</text>
  <text x="954" y="409.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">  verification_passed / step_failed -&gt; checkpoint_saved</text>
  <text x="954" y="424.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Phiên chạy thật trên emulator-5554 ghi nhận đủ 19/19 sự kiện chuẩn xác</text>
  <text x="954" y="438.5" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">Bằng chứng: 09_live_adb_workflow_execution.json</text>

  <rect x="34" y="410" width="5" height="76" rx="2" fill="#F27883"/>
  <text x="48" y="430" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700">Studio Storage &amp; Producer Keystore</text>
  <text x="48" y="447" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">SQLite WAL (farmerpro.db v2 Multi-Project Schema)</text>
  <text x="48" y="461.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">External Keystore: %LOCALAPPDATA%\FarmerPro\ProducerKeys\</text>
  <text x="48" y="476.0" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">32-byte Ed25519 SigningKey NEVER enters bundle/ or git</text>

  <rect x="478" y="72" width="415" height="430" rx="8" fill="#131926" stroke="#B291F7" stroke-width="1.5" stroke-dasharray="4,2"/>

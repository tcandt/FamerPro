  <text x="952" y="335" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Auto_Kingdom_SLG.exe (12.51 MB | SHA256: 95732232077c0747...)</text>
  <text x="952" y="349.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• PE RT_ICON (7 layers) + PE RT_RCDATA #7777 (PubKey: acb43ebd...)</text>
  <text x="952" y="364.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• bundle/: manifest + ui-schema (Emerald #10B981, 4 Tasks, 4 Cột OCR)</text>
  <text x="952" y="378.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• bundle/: 1 Workflow + 3 PNG Templates + signature.fpbundle.json</text>
  <text x="952" y="393.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Modules: ADB Core, Vision/OCR, Account Vault, Watchdog (Proxy OFF)</text>
  <text x="952" y="407.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• data/: runtime_kingdom-slg.db (SQLite WAL độc lập)</text>

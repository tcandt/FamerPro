  <text x="22" y="25" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18.5" font-weight="700">SƠ ĐỒ 1.1 — KIẾN TRÚC TỔNG QUAN FARMERPRO &amp; QUAN HỆ STUDIO — ENGINE — BUILDER — MINI RUNTIME</text>
  <text x="22" y="45" fill="#9FB2CC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="500">Minh họa cách FarmerPro Studio IDE sử dụng bộ 14 Rust Crates để sản xuất các Mini Auto-Tools chạy độc lập</text>
  
  <rect x="18" y="72" width="430" height="430" rx="8" fill="#111927" stroke="#1878F5" stroke-width="1.5" stroke-dasharray="4,2"/>

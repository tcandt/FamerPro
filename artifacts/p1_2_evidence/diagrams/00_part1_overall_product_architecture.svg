  <text x="498" y="76" fill="#B291F7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700">2. SHARED RUST CORE &amp; PACKAGER (14 Cargo Crates)</text>
<rect x="494" y="98" width="383" height="108" rx="6" fill="#16202F" stroke="#2A3647" stroke-width="1.5"/>
  <rect x="494" y="98" width="5" height="108" rx="2" fill="#B291F7"/>
  <text x="508" y="118" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700">Automation &amp; Workflow Engine Crates (Shared)</text>
  <text x="508" y="135" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• fp-domain / fp-workflow-schema / fp-workflow-runtime</text>
  <text x="508" y="149.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• fp-adb (Argv Command) / fp-device (Generation Fencing)</text>
  <text x="508" y="164.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• fp-vision (Multiscale SSD + WinRT OCR) / fp-actions (Safe Tap)</text>
  <text x="508" y="178.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• fp-scheduler (Device Leases) / fp-storage (SQLite WAL) / fp-security</text>
  <text x="508" y="193.0" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">100% Dùng chung cho cả Studio và mọi Mini Tool không cần sửa code</text>
<rect x="494" y="220" width="383" height="128" rx="6" fill="#1E222A" stroke="#E7B15B" stroke-width="1.5"/>
  <rect x="494" y="220" width="5" height="128" rx="2" fill="#E7B15B"/>
  <text x="508" y="240" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700">fp-builder (8-Step Packager - Studio/CLI Only)</text>
  <text x="508" y="257" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">Step 1-3: Validate Graph, Path Guard, 5-State Module Matrix</text>
  <text x="508" y="271.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">Step 4-5: Copy fp-mini-runtime.exe + Inject PE Icon &amp; RT_RCDATA #7777</text>
  <text x="508" y="286.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">Step 6-7: Copy bundle/ + ./bin/adb.exe + Sign Ed25519 (RFC 8032)</text>
  <text x="508" y="300.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">Step 8: Verify Signature via PE RT_RCDATA #7777 &amp; Audit Dependencies</text>
  <text x="508" y="315.0" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">MiniToolPackager::build_and_export_release()</text>
<rect x="494" y="362" width="383" height="124" rx="6" fill="#132325" stroke="#3BC38D" stroke-width="1.5"/>
  <rect x="494" y="362" width="5" height="124" rx="2" fill="#3BC38D"/>
  <text x="508" y="382" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700">fp-bundle-contract &amp; fp-bundle-verify (Runtime Guard)</text>
  <text x="508" y="399" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• fp-bundle-contract: Zero-Crypto Schemas, 5-State Module Matrix</text>
  <text x="508" y="413.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• fp-bundle-verify: Reads Trusted PubKey from PE RT_RCDATA #7777</text>
  <text x="508" y="428.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Verifies RFC 8032 Ed25519 Signature &amp; SHA-256 of every file</text>
  <text x="508" y="442.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Automatic Read-Only NTFS ACL Fallback -&gt; %LOCALAPPDATA%</text>
  <text x="508" y="457.0" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">Compile-time isolated: ZERO dependency on fp-builder</text>


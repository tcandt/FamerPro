  <text x="952" y="120" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700">Release Package #1: Auto_JX2_Mobile/</text>
  <text x="952" y="137" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Auto_JX2_Mobile.exe (12.51 MB | SHA256: 55c051cba31c269c...)</text>
  <text x="952" y="151.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• PE RT_ICON (7 layers) + PE RT_RCDATA #7777 (PubKey: acb43ebd...)</text>
  <text x="952" y="166.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• bundle/: manifest + ui-schema (Amber #F59E0B, 5 Tasks, 3 Cột OCR)</text>
  <text x="952" y="180.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• bundle/: 2 Workflows + 4 PNG Templates + signature.fpbundle.json</text>
  <text x="952" y="195.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• bin/: adb.exe + AdbWinApi.dll + AdbWinUsbApi.dll</text>
  <text x="952" y="209.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• data/: runtime_jx2-mobile.db (SQLite WAL độc lập)</text>
  <text x="952" y="224.0" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">Chạy trực tiếp cho người chơi Võ Hiệp 2 — Không cần Studio!</text>

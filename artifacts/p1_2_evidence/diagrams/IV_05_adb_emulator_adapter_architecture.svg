  <text x="948" y="341" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Instance #2: emulator-5556 (Secondary LDPlayer / SLG Farm)</text>
  <text x="948" y="355.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Physical USB/TCP Phone: 192.168.1.x:5555</text>
  <text x="948" y="370.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Cách ly hoàn toàn luồng lệnh theo `-s &lt;serial&gt;`</text>
  <text x="948" y="384.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Mỗi thiết bị được bảo vệ bởi Device Lease &amp; Generation Token riêng</text>

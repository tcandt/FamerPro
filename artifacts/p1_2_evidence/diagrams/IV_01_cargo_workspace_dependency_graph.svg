<rect x="36" y="214" width="420" height="82" rx="6" fill="#22211C" stroke="#E7B15B" stroke-width="1.5"/>
  <rect x="36" y="214" width="5" height="82" rx="2" fill="#E7B15B"/>
  <text x="50" y="234" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700">crates/fp-builder (Producer Packager &amp; Signer)</text>
  <text x="50" y="251" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• MiniToolPackager (Pipeline đóng gói 8 bước)</text>
  <text x="50" y="265.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• ProducerKeyManager (Đọc khóa bí mật từ %LOCALAPPDATA%)</text>
  <text x="50" y="280.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• pe_icon.rs: Win32 UpdateResourceW (PE Icon + RT_RCDATA #7777)</text>
<rect x="486" y="214" width="410" height="82" rx="6" fill="#142424" stroke="#3BC38D" stroke-width="1.5"/>
  <rect x="486" y="214" width="5" height="82" rx="2" fill="#3BC38D"/>
  <text x="500" y="234" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700">crates/fp-bundle-verify (PE Root of Trust &amp; Verifier)</text>
  <text x="500" y="251" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Đọc khóa công khai gốc từ PE RT_RCDATA #7777 của tiến trình</text>
  <text x="500" y="265.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Xác thực chữ ký RFC 8032 Ed25519 (ed25519-dalek VerifyingKey)</text>
  <text x="500" y="280.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Chống Path Traversal (validate_safe_relative_path)</text>
<rect x="926" y="214" width="438" height="82" rx="6" fill="#152232" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="926" y="214" width="5" height="82" rx="2" fill="#38BDF8"/>

  <text x="22" y="25" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18.5" font-weight="700">SƠ ĐỒ IV.1 — RUST CARGO WORKSPACE DEPENDENCY GRAPH (14 CRATES &amp; 3 APPS)</text>
  <text x="22" y="45" fill="#9FB2CC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="500">Ranh giới bảo mật thời điểm biên dịch: fp-mini-runtime hoàn toàn không phụ thuộc vào fp-builder</text>
  
  <rect x="18" y="72" width="1364" height="96" rx="8" fill="#111A27" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4,2"/>
  <rect x="30" y="61" width="305" height="21" rx="4" fill="#16202F" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="38" y="76" fill="#38BDF8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700">LAYER 1: APPLICATION BINARIES (apps/*)</text>
<rect x="36" y="94" width="420" height="64" rx="6" fill="#162234" stroke="#1878F5" stroke-width="1.5"/>
  <rect x="36" y="94" width="5" height="64" rx="2" fill="#1878F5"/>
  <text x="50" y="114" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700">apps/desktop (FarmerPro.exe - Studio IDE)</text>
  <text x="50" y="131" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">Tauri v2 Desktop Host + Studio IPC Commands + Builder UI Host</text>
  <text x="50" y="145.5" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">Phụ thuộc cả Runtime Core lẫn fp-builder (Ký &amp; Xuất gói)</text>
<rect x="486" y="94" width="410" height="64" rx="6" fill="#16202F" stroke="#2A3647" stroke-width="1.5"/>
  <rect x="486" y="94" width="5" height="64" rx="2" fill="#38BDF8"/>
  <text x="500" y="114" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700">apps/cli (fp-cli.exe - Diagnostic &amp; Build Runner)</text>
  <text x="500" y="131" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">CLI kiểm thử tự động, export-poc, live ADB runner, keygen</text>
  <text x="500" y="145.5" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">Phụ thuộc Runtime Core + fp-builder</text>
<rect x="926" y="94" width="438" height="64" rx="6" fill="#122624" stroke="#3BC38D" stroke-width="1.5"/>
  <rect x="926" y="94" width="5" height="64" rx="2" fill="#3BC38D"/>
  <text x="940" y="114" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700">apps/mini-runtime (fp-mini-runtime.exe -&gt; Auto_&lt;Game&gt;.exe)</text>
  <text x="940" y="131" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">Binary độc lập giao cho người dùng cuối của từng tựa game</text>
  <text x="940" y="145.5" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">CẤM PHỤ THUỘC fp-builder (Đã kiểm chứng bằng cargo tree)</text>


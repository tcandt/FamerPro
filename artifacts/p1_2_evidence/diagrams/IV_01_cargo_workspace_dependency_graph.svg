  <text x="940" y="251" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• GameProjectManifest, MiniToolUiSchema, ReleaseBundleManifest</text>
  <text x="940" y="265.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Mô hình Module 5 Trạng thái (ModuleRuntimeStatus)</text>
  <text x="940" y="280.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Kiểm toán phụ thuộc &amp; NTFS Read-Only Fallback (%LOCALAPPDATA%)</text>


  <line x1="0" y1="56" x2="1400" y2="56" stroke="#2A3647" stroke-width="1.5"/>
  <text x="22" y="25" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18.5" font-weight="700">SƠ ĐỒ IV.8 — MINI TOOL BUILD &amp; RELEASE PIPELINE (8-STEP PACKAGER)</text>
  <text x="22" y="45" fill="#9FB2CC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="500">Dây chuyền đóng gói 8 bước của fp-builder: Kiểm tra đồ thị -&gt; Nhúng PE Icon &amp; RT_RCDATA #7777 -&gt; Ký Ed25519 -&gt; Kiểm toán</text>
  
  <rect x="18" y="72" width="1364" height="430" rx="8" fill="#131924" stroke="#E7B15B" stroke-width="1.5" stroke-dasharray="4,2"/>
  <rect x="30" y="61" width="579" height="21" rx="4" fill="#16202F" stroke="#E7B15B" stroke-width="1.2"/>
  <text x="38" y="76" fill="#E7B15B" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700">8-STEP DETERMINISTIC MINI TOOL BUILD &amp; RELEASE PIPELINE (crates/fp-builder)</text>
<rect x="34" y="104" width="315" height="165" rx="6" fill="#152333" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="34" y="104" width="5" height="165" rx="2" fill="#38BDF8"/>
  <text x="48" y="124" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700">STEP 1: Validate Project, Schema &amp; Graphs</text>
  <text x="48" y="141" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Kiểm tra `GameProjectManifest` &amp; slug</text>
  <text x="48" y="155.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Kiểm tra `MiniToolUiSchema` (tasks, cột OCR)</text>
  <text x="48" y="170.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Chạy `WorkflowValidator` trên toàn bộ</text>
  <text x="48" y="184.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">  workflows được liên kết (start/end/edges)</text>
  <text x="48" y="199.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Thời gian thực tế: &lt; 1 ms</text>
  <text x="48" y="213.5" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">Status: PASS (2 workflows JX2 / 1 SLG)</text>
<rect x="372" y="104" width="315" height="165" rx="6" fill="#152333" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="372" y="104" width="5" height="165" rx="2" fill="#38BDF8"/>
  <text x="386" y="124" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700">STEP 2: Asset Integrity &amp; Path Guard</text>
  <text x="386" y="141" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Kiểm tra mọi `templateRef` trong Node Vision</text>
  <text x="386" y="155.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">  tồn tại thật trên đĩa (`templates/*.png`)</text>
  <text x="386" y="170.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Chặn Path Traversal (`../` hoặc đường dẫn</text>
  <text x="386" y="184.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">  tuyệt đối) bằng `validate_safe_relative_path`</text>
  <text x="386" y="199.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Kiểm tra header file `branding/icon.ico`</text>
  <text x="386" y="213.5" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">Status: PASS (4 PNGs JX2 / 3 PNGs SLG)</text>
<rect x="710" y="104" width="315" height="165" rx="6" fill="#1B1E32" stroke="#B291F7" stroke-width="1.5"/>
  <rect x="710" y="104" width="5" height="165" rx="2" fill="#B291F7"/>
  <text x="724" y="124" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700">STEP 3: Resolve 5-State Module Matrix</text>
  <text x="724" y="141" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Đối chiếu 6 module hệ thống với cấu hình</text>
  <text x="724" y="155.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">  `packaged_modules` của Game Project</text>
  <text x="724" y="170.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Xác thực đồ thị phụ thuộc module (VD:</text>
  <text x="724" y="184.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">  `mod.vision_ocr` yêu cầu `mod.adb_core`)</text>
  <text x="724" y="199.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Khóa danh sách quyền (`requiredCapabilities`)</text>
  <text x="724" y="213.5" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">Status: PASS (5 modules JX2 / 4 SLG)</text>
<rect x="1048" y="104" width="316" height="165" rx="6" fill="#1B1E32" stroke="#B291F7" stroke-width="1.5"/>
  <rect x="1048" y="104" width="5" height="165" rx="2" fill="#B291F7"/>
  <text x="1062" y="124" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700">STEP 4: Copy Dedicated Runtime Binary</text>
  <text x="1062" y="141" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Sao chép `target/release/fp-mini-runtime.exe`</text>
  <text x="1062" y="155.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">  sang `releases/&lt;slug&gt;/Auto_&lt;Game&gt;.exe`</text>
  <text x="1062" y="170.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Binary này hoàn toàn KHÔNG chứa mã nguồn</text>
  <text x="1062" y="184.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">  của Studio hay `fp-builder`</text>
  <text x="1062" y="199.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Kích thước: 12,515,840 bytes (~12.5 MB)</text>
  <text x="1062" y="213.5" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">Status: PASS (30 ms)</text>
<rect x="34" y="312" width="315" height="172" rx="6" fill="#23211A" stroke="#E7B15B" stroke-width="1.5"/>
  <rect x="34" y="312" width="5" height="172" rx="2" fill="#E7B15B"/>
  <text x="48" y="332" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700">STEP 5: PE Icon &amp; RT_RCDATA #7777 Injection</text>
  <text x="48" y="349" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Gọi Win32 API `BeginUpdateResourceW` /</text>
  <text x="48" y="363.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">  `UpdateResourceW` / `EndUpdateResourceW`</text>
  <text x="48" y="378.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Nhúng 7 lớp biểu tượng `.ico` vào `RT_ICON`</text>
  <text x="48" y="392.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Nhúng cứng 32-byte Ed25519 Public Key vào</text>
  <text x="48" y="407.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">  tài nguyên PE `RT_RCDATA (#10) ID #7777`</text>
  <text x="48" y="421.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Mở lại PE kiểm tra readback khớp 100%</text>
  <text x="48" y="436.0" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">Status: PASS (1,018 ms)</text>
<rect x="372" y="312" width="315" height="172" rx="6" fill="#23211A" stroke="#E7B15B" stroke-width="1.5"/>
  <rect x="372" y="312" width="5" height="172" rx="2" fill="#E7B15B"/>
  <text x="386" y="332" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700">STEP 6: Package Bundle Assets &amp; ADB</text>
  <text x="386" y="349" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Xuất `bundle/manifest.fpbundle.json`,</text>
  <text x="386" y="363.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">  `ui-schema.json`, `workflows.fpbundle.json`</text>
  <text x="386" y="378.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Sao chép `bundle/templates/*.png` &amp; `.ico`</text>
  <text x="386" y="392.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Đóng gói kèm `./bin/adb.exe`,</text>
  <text x="386" y="407.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">  `AdbWinApi.dll`, `AdbWinUsbApi.dll`</text>
  <text x="386" y="421.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Khởi tạo thư mục `./data/` cho SQLite WAL</text>
  <text x="386" y="436.0" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">Status: PASS (24 ms)</text>
<rect x="710" y="312" width="315" height="172" rx="6" fill="#142624" stroke="#3BC38D" stroke-width="1.5"/>
  <rect x="710" y="312" width="5" height="172" rx="2" fill="#3BC38D"/>
  <text x="724" y="332" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700">STEP 7: SHA-256 Table &amp; Ed25519 Signing</text>
  <text x="724" y="349" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Băm SHA-256 từng file trong `bundle/`</text>
  <text x="724" y="363.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Tạo chuỗi Canonical Manifest Payload</text>
  <text x="724" y="378.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Đọc khóa bí mật từ kho khóa ngoài</text>
  <text x="724" y="392.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">  `%LOCALAPPDATA%\FarmerPro\ProducerKeys`</text>
  <text x="724" y="407.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Ký chữ ký số RFC 8032 Ed25519 (64 bytes)</text>
  <text x="724" y="421.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Xuất `bundle/signature.fpbundle.json`</text>
  <text x="724" y="436.0" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">KeyID: fp-ed25519-acb43ebd9ab4 (9 ms)</text>
<rect x="1048" y="312" width="316" height="172" rx="6" fill="#142624" stroke="#3BC38D" stroke-width="1.5"/>
  <rect x="1048" y="312" width="5" height="172" rx="2" fill="#3BC38D"/>
  <text x="1062" y="332" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700">STEP 8: PE Root-of-Trust Verify &amp; Audit</text>
  <text x="1062" y="349" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Đọc lại khóa công khai từ PE `RT_RCDATA #7777`</text>
  <text x="1062" y="363.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">  của file `Auto_&lt;Game&gt;.exe` vừa xuất</text>
  <text x="1062" y="378.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Xác thực chữ ký Ed25519 &amp; toàn bộ bảng SHA-256</text>
  <text x="1062" y="392.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Kiểm toán phụ thuộc: ADB DLLs, WebView2</text>
  <text x="1062" y="407.0" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">  Evergreen, WinRT OCR, quyền ghi SQLite</text>
  <text x="1062" y="421.5" fill="#CAD5E2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">• Xuất `build-report.json` kèm SHA-256 EXE</text>
  <text x="1062" y="436.0" fill="#38BDF8" font-family="Consolas, monospace" font-size="10.5">Status: PASS (13 ms | Total: ~1.1s)</text>

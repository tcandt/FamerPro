[workspace]
members = [
    "crates/fp-domain",
    "crates/fp-adb",
    "crates/fp-device",
    "crates/fp-vision",
    "crates/fp-actions",
    "crates/fp-workflow-schema",
    "crates/fp-workflow-runtime",
    "crates/fp-scheduler",
    "crates/fp-storage",
    "crates/fp-security",
    "crates/fp-testkit",
    "crates/fp-bundle-contract",
    "crates/fp-bundle-verify",
    "crates/fp-builder",
    "apps/cli",
    "apps/desktop/src-tauri",
    "apps/mini-runtime",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["FarmerPro Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
uuid = { version = "1.13", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.33", features = ["bundled"] }
rand = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tauri = { version = "2.3", features = [] }
tauri-build = { version = "2.0" }
clap = { version = "4.5", features = ["derive"] }
